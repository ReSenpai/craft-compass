# Checks every pull request: Lua syntax, the smoke test in English and Russian, matching versions in the TOC files
# and CHANGELOG.md, a new version when the addon itself changed, and no keys or tokens in the repository.
name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python libraries
        run: python -m pip install --quiet "lupa==2.8" "luaparser==4.2.0"
      - name: Lua syntax
        run: python tests/check_syntax.py
      - name: Smoke test
        run: |
          python tests/smoke.py enUS
          python tests/smoke.py ruRU
      - name: Version
        run: python tools/release_check.py --require-new-version "origin/${{ github.base_ref || 'main' }}"
      - name: Keys and tokens (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
